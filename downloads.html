<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Excel Guru</title>
    <meta name="description" content="Secure downloads for Excel Guru students and workshops.">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="Excel Guru Logo" id="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Excel Guru</span>
                    <span class="logo-tagline">Excel Thinking Training</span>
                </div>
            </a>
            <button class="menu-toggle" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html#hero" class="nav-link">Home</a></li>
                    <li><a href="index.html#about" class="nav-link">About</a></li>
                    <li><a href="index.html#methodology" class="nav-link">Methodology</a></li>
                    <li><a href="index.html#services" class="nav-link">Services</a></li>
                    <li><a href="#" class="nav-link active">Downloads</a></li>
                    <li><a href="index.html#contact" class="nav-link btn-primary-outline">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="downloads-section">
            <div class="container downloads-container">
                <div class="glass-card login-card">
                    <h2 class="text-center section-title" style="font-size: 2rem;">Student Login</h2>
                    <p class="text-center text-muted" style="margin-bottom: 2rem;">Select your institution or event and
                        sign in
                        to access resources.</p>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="institution">Institution / Event</label>
                            <select id="institution" class="form-input" required>
                                <option value="" disabled selected>Select Institution / Event</option>
                                <option value="edublitz_learning">Edublitz Learning</option>
                                <option value="excelguru_offline">excelguru offline workshop</option>
                                <option value="excelguru_workshop">excelguru online workshop</option>
                                <option value="jamia_ainul_huda">Jamia Ainul Huda Kappad</option>
                                <option value="jamia_ashariyya">Jamia Ash'ariyya Madavoor</option>
                                <option value="mastered_skill">Mastered Skill Academy</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" class="form-input" placeholder="Enter username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-input" placeholder="Enter password"
                                required>
                        </div>

                        <div id="error-msg" class="error-message"
                            style="display: none; color: #ef4444; margin-bottom: 1rem; font-size: 0.9rem;">
                            Invalid credentials. Please try again.
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">Access Files</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-brand">
                <h3>Excel Guru</h3>
                <p>Excel Thinking - Unconventional Excel Training</p>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="downloads.js"></script>
</body>

</html>
